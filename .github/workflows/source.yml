name: Source and native Anki
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    name: Anki packages
    runs-on: macos-15
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      # Offscreen Qt cannot reliably initialize Chromium GPU canvas surfaces.
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt ruff==0.14.3
      - run: |
          ruff format --check scripts tests
          ruff check --select E4,E7,E9,F scripts tests
          python -m unittest discover -s tests
      - name: Build registered artwork and both languages
        run: |
          python scripts/artwork.py --font /System/Library/Fonts/SFNS.ttf --out "$RUNNER_TEMP/periodic/artwork"
          git diff --exit-code -- artwork
          python scripts/build.py --artwork "$RUNNER_TEMP/periodic/artwork" --out "$RUNNER_TEMP/periodic/packages"
          python scripts/build.py --artwork "$RUNNER_TEMP/periodic/artwork" --out "$RUNNER_TEMP/periodic/rebuild"
      - name: Native import, editing, update and scheduling
        run: |
          python scripts/checks/validate_anki.py --packages "$RUNNER_TEMP/periodic/packages" --update-packages "$RUNNER_TEMP/periodic/rebuild" --out "$RUNNER_TEMP/periodic/anki-check"
      - name: Native reviewer, every ordinal and theme
        run: |
          ANKI_WEB=$(python -c 'from importlib.metadata import distribution; print(distribution("aqt").locate_file("_aqt/data/web"))')
          python scripts/checks/render_anki.py --evidence "$RUNNER_TEMP/periodic/anki-check" --web "$ANKI_WEB" --out "$RUNNER_TEMP/periodic/render-check"
          python scripts/checks/render_anki.py --evidence "$RUNNER_TEMP/periodic/anki-check" --web "$ANKI_WEB" --out "$RUNNER_TEMP/periodic/navigation-check" --sample --document-delay-ms 300
      - name: Retain validation evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: periodic-anki-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/periodic/artwork/artwork.json
            ${{ runner.temp }}/periodic/anki-check/report.json
            ${{ runner.temp }}/periodic/render-check/render-report.json
            ${{ runner.temp }}/periodic/navigation-check/render-report.json
          if-no-files-found: warn
          retention-days: 14
